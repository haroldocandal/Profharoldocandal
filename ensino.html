                        LINK_EXERCICIOS: "https://www.notion.so/lqtsm/Lista-de-Exerc-cios-Primeira-Lei-Energia-Interna-e-Entalpia-3488e483182a8078803bcae783bcebf0?source=copy_link"
                    },
                    {
                        TITULO: "Entropia, Segunda e Terceira Leis",
                        LINK_TEORIA: "",
                        LINK_EXERCICIOS: "https://www.notion.so/lqtsm/Lista-de-Exerc-cios-Entropia-Segunda-e-Terceira-Leis-3538e483182a80d5bf12fec5dacb72e0?source=copy_link"
                    },
                    {
                        TITULO: "Equilíbrio Químico",
                        LINK_TEORIA: "",
                        LINK_EXERCICIOS: "https://www.notion.so/lqtsm/Lista-de-Exerc-cios-Energia-Livre-e-Equil-brio-3598e483182a8044a64fdfeef4a7ab47?source=copy_link"
                    }
                ]
            },

            {
                ID: "quanticaPG",
                NOME: "Química Quântica (Métodos)",
                ICONE_ABA: "fa-solid fa-atom",
                EMOJI: "⚛️",
                DESCRICAO: "Teoria quântica avançada com aplicações em estrutura eletrônica e espectroscopia.",
                TOPICOS: [
                    { TITULO: "1. O método variacional", LINK_TEORIA: "", LINK_EXERCICIOS: "" },
                    { TITULO: "2. Teoria de perturbação", LINK_TEORIA: "", LINK_EXERCICIOS: "" },
                    { TITULO: "3. Átomos Multieletrônicos, Correlação Eletrônica e o Método de Hartree-Fock", LINK_TEORIA: "", LINK_EXERCICIOS: "" },

                    { TITULO: "8. Teoria do Funcional da Densidade (DFT)", LINK_TEORIA: "", LINK_EXERCICIOS: "" },
                    { TITULO: "9. Métodos Semi-Empíricos e Mecânica Molecular", LINK_TEORIA: "", LINK_EXERCICIOS: "" }
                ]
            }

        ];
    </script>

    <!-- ==================================================================== -->
    <!--  MOTOR DE RENDERIZAÇÃO — não precisa mexer daqui para baixo          -->
    <!-- ==================================================================== -->
    <script>
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const temLink = v => typeof v === "string" && v.trim() !== "";

        function botao(link, rotulo, icone, classe) {
            if (!temLink(link)) {
                return `<span class="link-btn btn-disabled"><i class="fa-regular fa-clock"></i> ${esc(rotulo)} (Em breve)</span>`;
            }
            return `<a href="${esc(link.trim())}" target="_blank" rel="noopener" class="link-btn ${classe}"><i class="${icone}"></i> ${esc(rotulo)}</a>`;
        }

        function topicoHTML(t) {
            return `<div class="material-item">
                <h4>${esc(t.TITULO)}</h4>
                <div class="material-links">
                    ${botao(t.LINK_TEORIA, "Teoria", "fa-solid fa-file-pdf", "btn-available-blue")}
                    ${botao(t.LINK_EXERCICIOS, "Exercícios", "fa-solid fa-list-check", "btn-available-teal")}
                </div>
            </div>`;
        }

        function provasHTML(p) {
            if (!p || !p.LISTAS || !p.LISTAS.length) return "";
            const botoes = p.LISTAS.map(l => botao(l.LINK, l.TITULO, "fa-solid fa-list-check", "btn-available-teal")).join("\n");
            return `<div class="info-box box-blue">
                <div class="box-title"><i class="fa-solid fa-list-check"></i> ${esc(p.TITULO_CAIXA || "Listas de Revisão")}</div>
                <div class="materials-list">
                    <div class="material-item">
                        <h4>Provas</h4>
                        <div class="material-links">${botoes}</div>
                    </div>
                </div>
            </div>`;
        }

        function disciplinaHTML(d, ativa) {
            const teoriaGeral = temLink(d.LINK_TEORIA_GERAL)
                ? `<div style="margin-bottom: 20px;">
                       <a href="${esc(d.LINK_TEORIA_GERAL.trim())}" target="_blank" rel="noopener" class="link-btn btn-available-blue"><i class="fa-solid fa-file-pdf"></i> Teoria (Todos os Temas)</a>
                   </div>`
                : "";

            return `<section id="${esc(d.ID)}" class="tab-content${ativa ? " active" : ""}" role="tabpanel" aria-labelledby="tab-${esc(d.ID)}">
                <div class="subject-header">
                    <div class="subject-icon" aria-hidden="true">${d.EMOJI || ""}</div>
                    <div class="subject-title">
                        <h2>${esc(d.NOME)}</h2>
                        <p class="subject-desc">${esc(d.DESCRICAO || "")}</p>
                    </div>
                </div>
                ${provasHTML(d.PROVAS)}
                <div class="info-box box-gray">
                    <div class="box-title"><i class="fa-solid fa-layer-group"></i> Materiais por Tópico</div>
                    ${teoriaGeral}
                    <div class="materials-list">${(d.TOPICOS || []).map(topicoHTML).join("\n")}</div>
                </div>
            </section>`;
        }

        (function render() {
            const nav = document.getElementById("tabsNav");
            const conteudo = document.getElementById("tabsContent");

            nav.innerHTML = DISCIPLINAS.map((d, i) => `
                <button type="button" class="tab-btn${i === 0 ? " active" : ""}" id="tab-${esc(d.ID)}"
                        role="tab" aria-controls="${esc(d.ID)}" aria-selected="${i === 0}" data-alvo="${esc(d.ID)}">
                    <i class="${d.ICONE_ABA}" style="font-size: 1.5rem;" aria-hidden="true"></i>
                    <span>${esc(d.NOME)}</span>
                </button>`).join("");

            conteudo.innerHTML = DISCIPLINAS.map((d, i) => disciplinaHTML(d, i === 0)).join("\n");

            nav.setAttribute("role", "tablist");
            nav.addEventListener("click", e => {
                const btn = e.target.closest(".tab-btn");
                if (!btn) return;
                nav.querySelectorAll(".tab-btn").forEach(b => {
                    b.classList.remove("active");
                    b.setAttribute("aria-selected", "false");
                });
                conteudo.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
                btn.classList.add("active");
                btn.setAttribute("aria-selected", "true");
                document.getElementById(btn.dataset.alvo).classList.add("active");
            });
        })();
    </script>
</body>

</html>
